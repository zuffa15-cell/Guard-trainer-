/* Mobile weekly calendar: show all 7 days at once without horizontal scrolling. */
.weekly-calendar-fit{overflow-x:hidden!important;}
.weekly-calendar-fit>div{width:100%!important;max-width:none!important;min-width:0!important;}
.weekly-calendar-fit .flex-1{min-width:0!important;}
@media(max-width:639px){
  .weekly-calendar-fit .w-\[42px\]{width:34px!important;}
  .weekly-calendar-fit .text-\[9px\]{font-size:8px!important;}
  .weekly-calendar-fit .text-\[8px\]{font-size:7px!important;}
  .weekly-calendar-fit .sm\:px-\[7px\]{padding-left:3px!important;padding-right:3px!important;}
}

/* FINAL MOBILE WEEK: compact 7-column layout, readable text and occupancy. */
@media (max-width: 639px){
  .weekly-calendar-fit{width:100%!important;max-width:100%!important;overflow-x:hidden!important;overflow-y:auto!important;}
  .weekly-calendar-fit>div{width:100%!important;max-width:100%!important;min-width:0!important;}
  .weekly-calendar-fit>div>.flex{width:100%!important;min-width:0!important;}
  .weekly-calendar-fit>div>.flex:first-child{display:grid!important;grid-template-columns:34px repeat(7,minmax(0,1fr))!important;}
  .weekly-calendar-fit>div>.flex:nth-child(2){display:grid!important;grid-template-columns:34px minmax(0,1fr)!important;}
  .weekly-calendar-fit>div>.flex:nth-child(2)>div:nth-child(2){display:grid!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;min-width:0!important;width:100%!important;}
  .weekly-calendar-fit>div>.flex:first-child>div{min-width:0!important;width:auto!important;}
  .weekly-calendar-fit>div>.flex:nth-child(2)>div:first-child{width:34px!important;min-width:34px!important;}
  .weekly-calendar-fit .weekly-day-card{left:calc(var(--day)*14.285714% + 2px)!important;width:calc(14.285714% - 4px)!important;}
  .weekly-calendar-fit .text-\[8px\]{font-size:8px!important;line-height:9px!important;}
  .weekly-calendar-fit .text-\[9px\]{font-size:9px!important;line-height:10px!important;}
  .weekly-calendar-fit .text-\[7px\]{font-size:7px!important;line-height:8px!important;}
  .weekly-calendar-fit .text-\[10px\]{font-size:10px!important;line-height:11px!important;}
  .weekly-calendar-fit .weekly-train-title{font-size:8px!important;line-height:9px!important;white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important;text-overflow:ellipsis!important;}
  .weekly-calendar-fit .weekly-train-desc{font-size:7px!important;line-height:8px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}.weekly-train-title{font-size:8px!important;line-height:10px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}.weekly-train-time{font-size:8px!important;line-height:10px!important;}.weekly-train-occupancy{font-size:8px!important;line-height:10px!important;font-weight:700!important;white-space:nowrap!important;overflow:hidden!important;}.weekly-train-desc{display:none!important;}
  .weekly-calendar-fit .weekly-train-occ{font-size:8px!important;line-height:9px!important;font-weight:700!important;white-space:nowrap!important;}
  .weekly-calendar-fit .weekly-train-time{font-size:8px!important;line-height:9px!important;white-space:nowrap!important;}
}

/* Denný zoznam: mesačný kalendár + tréningy vybraného dňa. Týždenný kalendár je odstránený. */
.weekly-calendar-fit{display:none!important;}
.daily-side{display:none!important;}
.daily-footer .daily-grid{grid-template-columns:1fr!important;}
.daily-footer{background:#fcfcfc!important;}
@media(max-width:639px){.daily-footer{padding-top:10px!important;}.daily-footer .grid-cols-1{grid-template-columns:1fr!important;}}

  function inject(){var buttons=document.querySelectorAll('button'),admin=null;for(var i=0;i<buttons.length;i++){if((buttons[i].textContent||'').trim()==='Admin'){admin=buttons[i];break}}if(!admin)return;var parent=admin.parentElement;if(!parent)return;var b=document.getElementById(BTN);if(!b){b=document.createElement('button');b.id=BTN;b.type='button';b.textContent='Štatistiky';b.onclick=open;b.style.cssText='margin-left:8px;padding:9px 14px;border:1px solid #ddd;border-radius:999px;background:#fff;color:#333;font-size:13px;white-space:nowrap';parent.appendChild(b)}b.style.display=isAdmin()?'inline-block':'none'}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',inject);else setTimeout(inject,500);
  new MutationObserver(function(){setTimeout(inject,50)}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
})();
